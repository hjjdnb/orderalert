name: 构建安卓64位APK

on:
  workflow_dispatch:


jobs:

  build:

    runs-on: ubuntu-22.04


    steps:


    # 拉取代码
    - name: Checkout
      uses: actions/checkout@v5



    # 安装环境
    - name: 安装依赖
      run: |

        sudo apt update

        sudo apt install -y \
          python3-pip \
          git \
          zip \
          unzip \
          openjdk-17-jdk \
          autoconf \
          libtool \
          pkg-config \
          zlib1g-dev \
          libncurses5-dev \
          libncursesw5-dev \
          cmake



    # 设置Java17
    - name: 设置Java环境
      run: |

        echo "JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64" >> $GITHUB_ENV



    # 安装Android SDK和NDK
    - name: 安装Android工具
      run: |

        yes | sdkmanager --licenses || true

        sdkmanager "platform-tools"

        sdkmanager "platforms;android-33"

        sdkmanager "build-tools;33.0.2"

        sdkmanager "ndk;25.2.9519653"



    # 安装Buildozer
    - name: 安装Buildozer
      run: |

        python3 -m pip install --upgrade pip

        pip uninstall -y buildozer || true

        pip install buildozer==1.5.0

        pip install cython==0.29.37



    # 设置NDK路径
    - name: 设置NDK
      run: |

        echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/25.2.9519653" >> $GITHUB_ENV

        mkdir -p $HOME/.buildozer/android/platform

        ln -s $ANDROID_HOME/ndk/25.2.9519653 \
        $HOME/.buildozer/android/platform/android-ndk-r25b || true



    # 检查环境
    - name: 检查环境
      run: |

        java -version

        ls $ANDROID_HOME/ndk



    # 编译APK
    - name: 编译APK
      run: |

        buildozer android clean

        buildozer -v android debug --android-ndk-api=24



    # 上传APK
    - name: 上传APK
      uses: actions/upload-artifact@v5

      with:

        name: OrderAlert-arm64-v8a

        path: bin/*.apk
