name: 构建安卓64位APK

on:
  workflow_dispatch:

jobs:
  build:

    runs-on: ubuntu-22.04


    steps:

    # 拉取代码
    - name: 拉取仓库代码
      uses: actions/checkout@v4



    # 安装系统环境
    - name: 安装编译环境
      run: |

        sudo apt update

        sudo apt install -y \
        python3-pip \
        git \
        zip \
        unzip \
        openjdk-17-jdk \
        autoconf \
        libtool \
        pkg-config \
        zlib1g-dev \
        libncurses5-dev \
        libncursesw5-dev \
        cmake



    # Python环境
    - name: 安装Buildozer
      run: |

        python3 -m pip install --upgrade pip

        pip install buildozer==1.5.0

        pip install cython==0.29.37



    # 检查文件
    - name: 检查项目文件
      run: |

        ls -la

        echo "=========="

        head -30 buildozer.spec



    # 设置Android环境
    - name: 配置Android版本
      run: |

        echo "android.ndk = 25b" >> buildozer.spec

        echo "android.ndk_api = 24" >> buildozer.spec



    # 编译APK
    - name: 开始编译APK
      run: |

        yes | buildozer android clean

        yes | buildozer -v android debug



    # 上传APK
    - name: 保存APK文件
      uses: actions/upload-artifact@v4

      with:

        name: OrderAlert-arm64-v8a

        path: bin/*.apk
