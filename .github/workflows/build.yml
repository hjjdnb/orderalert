name: 构建安卓APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

    - name: 下载代码
      uses: actions/checkout@v4

    - name: 安装环境
      run: |
        sudo apt update

        sudo apt install -y \
        python3-pip \
        git \
        zip \
        unzip \
        openjdk-17-jdk \
        autoconf \
        libtool \
        pkg-config \
        zlib1g-dev \
        libncurses5-dev \
        libncursesw5-dev \
        cmake

        pip install --upgrade pip
        pip install buildozer
        pip install cython==0.29.37

    - name: 编译APK
      run: |
        buildozer android clean
        buildozer -v android debug

    - name: 保存APK
      uses: actions/upload-artifact@v4
      with:
        name: 安卓64位APK
        path: bin/*.apk
