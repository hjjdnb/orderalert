name: 构建安卓64位APK

on:
  workflow_dispatch:


jobs:

  build:

    runs-on: ubuntu-22.04


    steps:


    - name: 拉取代码
      uses: actions/checkout@v5



    - name: 安装系统环境
      run: |

        sudo apt update

        sudo apt install -y \
        python3-pip \
        git \
        zip \
        unzip \
        openjdk-17-jdk \
        autoconf \
        libtool \
        pkg-config \
        zlib1g-dev \
        libncurses5-dev \
        libncursesw5-dev \
        cmake



    - name: 安装 Android SDK NDK
      run: |

        yes | sdkmanager --licenses || true

        sdkmanager "ndk;25.2.9519653"




    - name: 安装Python环境
      run: |

        pip install --upgrade pip

        pip install buildozer==1.5.0

        pip install cython==0.29.37



    - name: 设置NDK路径
      run: |

        echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/25.2.9519653" >> $GITHUB_ENV




    - name: 编译APK
      run: |

        buildozer android clean

        yes | buildozer -v android debug



    - name: 上传APK
      uses: actions/upload-artifact@v5

      with:

        name: OrderAlert-arm64-apk

        path: bin/*.apk
