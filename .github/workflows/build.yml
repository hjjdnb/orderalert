name: 构建安卓APK

on:
  workflow_dispatch:

jobs:
  build:

    runs-on: ubuntu-22.04

    steps:

    - name: 拉取代码
      uses: actions/checkout@v4


    - name: 安装依赖
      run: |

        sudo apt update

        sudo apt install -y \
        python3-pip \
        git \
        zip \
        unzip \
        openjdk-17-jdk \
        autoconf \
        libtool \
        pkg-config \
        zlib1g-dev \
        libncurses5-dev \
        libncursesw5-dev \
        cmake


    - name: 安装Python环境
      run: |

        python3 -m pip install --upgrade pip

        pip install buildozer

        pip install cython==0.29.37


    - name: 检查文件
      run: |

        ls -la

        head -10 buildozer.spec


    - name: 编译APK
      run: |

        yes | buildozer -v android debug


    - name: 上传APK
      uses: actions/upload-artifact@v4

      with:

        name: OrderAlert-APK

        path: bin/*.apk
